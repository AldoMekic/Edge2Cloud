
services:

  edge-service:
    build: ./edge/pep
    container_name: mvp-edge
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - edge-network
      - edge-cloud-link

  cloud-service:
    build: ./cloud/pip_stage2
    container_name: mvp-cloud
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      FGA_URL: http://openfga:8080
      FGA_STORE_ID: ${FGA_STORE_ID:?FGA_STORE_ID is required}
      FGA_MODEL_ID: ${FGA_MODEL_ID:?FGA_MODEL_ID is required}
    depends_on:
      openfga:
        condition: service_started
    networks:
      - cloud-network
      - edge-cloud-link

  postgres:
    image: postgres:17
    container_name: mvp-postgres
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp_local_password}
      POSTGRES_DB: openfga
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloud-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U openfga -d openfga"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.20.0
    container_name: mvp-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${POSTGRES_PASSWORD:-mvp_local_password}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloud-network
    restart: "no"

  openfga:
    image: openfga/openfga:v1.20.0
    container_name: mvp-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${POSTGRES_PASSWORD:-mvp_local_password}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - cloud-network
      - edge-cloud-link

  redis:
    image: redis:7.4-alpine
    container_name: mvp-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - edge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pip-stage1:
    build: ./edge/pip_stage1
    container_name: mvp-pip-stage1
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CLOUD_PIP_URL: http://cloud-service:8000
      CACHE_TTL_SECONDS: "5"
      FGA_MODEL_ID: ${FGA_MODEL_ID:?FGA_MODEL_ID is required}
    depends_on:
      redis:
        condition: service_healthy
      cloud-service:
        condition: service_started
    networks:
      - edge-network
      - edge-cloud-link



  local-pdp:
    build: ./edge/pdp
    container_name: mvp-local-pdp
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      LOCAL_PIP_URL: http://pip-stage1:8000
      DIGITAL_TWIN_URL: http://digital-twin:8000
      DT_MAX_AGE_SECONDS: "10"
      POLICY_DIR: /app/policies
    volumes:
      - ./policies/odrl:/app/policies:ro
    depends_on:
      pip-stage1:
        condition: service_started
      digital-twin:
        condition: service_started
    networks:
      - edge-network
      - edge-host-access
  
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mvp-mqtt
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - edge-network
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5

  digital-twin:
    build: ./edge/digital_twin
    container_name: mvp-digital-twin
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DT_MAX_AGE_SECONDS: "10"
      DT_STORAGE_TTL_SECONDS: "120"
    depends_on:
      mqtt:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - edge-network
      - edge-host-access

  iot-simulator:
    build: ./edge/iot_simulator
    container_name: mvp-iot-simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      EDGE_ID: edge-001
      DEVICE_ID: actuator-001
      TELEMETRY_INTERVAL: "2"
      DEVICE_STATE: IDLE
      DEVICE_TEMPERATURE: "42.5"
    depends_on:
      digital-twin:
        condition: service_started
    networks:
      - edge-network


networks:

  edge-network:
    internal: true

  cloud-network:
    internal: true

  edge-cloud-link:
    driver: bridge

  edge-host-access:
    driver: bridge


volumes:

  postgres_data:
