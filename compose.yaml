services:

  edge-service:
    build: ./edge/pep
    container_name: mvp-edge
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - edge-network
      - edge-cloud-link

  cloud-service:
    build: ./cloud/pip_stage2
    container_name: mvp-cloud
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      FGA_URL: http://openfga:8080
      FGA_STORE_ID: ${FGA_STORE_ID:?FGA_STORE_ID is required}
      FGA_MODEL_ID: ${FGA_MODEL_ID:?FGA_MODEL_ID is required}
    networks:
      - cloud-network
      - edge-cloud-link

  postgres:
    image: postgres:17
    container_name: mvp-postgres
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: mvp_local_password
      POSTGRES_DB: openfga
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.20.0
    container_name: mvp-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:mvp_local_password@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloud-network
    restart: "no"

  openfga:
    image: openfga/openfga:v1.20.0
    container_name: mvp-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:mvp_local_password@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - cloud-network
      - edge-cloud-link

  redis:
    image: redis:7.4-alpine
    container_name: mvp-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - edge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pip-stage1:
    build: ./edge/pip_stage1
    container_name: mvp-pip-stage1
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CLOUD_PIP_URL: http://cloud-service:8000
      CACHE_TTL_SECONDS: "5"
      FGA_MODEL_ID: ${FGA_MODEL_ID:?FGA_MODEL_ID is required}
    depends_on:
      redis:
        condition: service_healthy
      cloud-service:
        condition: service_started
    networks:
      - edge-network
      - edge-cloud-link




networks:
  edge-network:
    internal: true

  cloud-network:
    internal: true

  edge-cloud-link:
    driver: bridge

volumes:
  postgres_data:
