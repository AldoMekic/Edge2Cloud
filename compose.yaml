services:

  edge-service:
    build: ./edge/pep
    container_name: mvp-edge
    ports:
      - "8001:8000"
    networks:
      - edge-network
      - edge-cloud-link

  cloud-service:
    build: ./cloud/pip_stage2
    container_name: mvp-cloud
    ports:
      - "8002:8000"
    networks:
      - cloud-network
      - edge-cloud-link

networks:

  edge-network:
    internal: true

  cloud-network:
    internal: true

  edge-cloud-link:
    driver: bridge
